name = "lod-bracket-api"
main = "src/index.js"
compatibility_date = "2026-05-14"

[vars]
APP_BASE_URL = "https://lod-bracket.pages.dev"

# Set these with `wrangler secret put`; do not commit API keys here.
# RESEND_FROM may remain onboarding@resend.dev for initial testing.

[[durable_objects.bindings]]
name = "BRACKET_ROOMS"
class_name = "BracketRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BracketRoom"]
