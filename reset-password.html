<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset your password</title>
  <link rel="stylesheet" href="bracket.css?v=interactive-tools-190">
  <link rel="stylesheet" href="login.css?v=4">
</head>
<body>
  <img class="page-background" src="assets/background.png?v=5" alt="" aria-hidden="true">
  <main class="login-shell">
    <section class="panel login-card" aria-labelledby="resetTitle">
      <p class="eyebrow">LOD Bracket</p>
      <h1 id="resetTitle">Set a new password</h1>
      <form id="passwordResetForm" class="login-form">
        <label>
          New password
          <input id="newPassword" type="password" autocomplete="new-password" minlength="8" required>
        </label>
        <label>
          Confirm new password
          <input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required>
        </label>
        <button type="submit">Set new password</button>
      </form>
      <p id="resetMessage" class="login-message" aria-live="polite"></p>
      <a class="button-link" href="login.html">Return to sign in</a>
    </section>
  </main>
  <script src="config.js?v=5"></script>
  <script src="reset-password.js?v=1"></script>
</body>
</html>
